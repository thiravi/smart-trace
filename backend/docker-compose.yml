version: '3.8'

services:
  performancesnap-backend:
    build: .
    container_name: performancesnap-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/performancesnap
      - DB_MAX_POOL_SIZE=10
      - DB_CONNECTION_TIMEOUT=30000
      - LOG_LEVEL=info
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongo
    networks:
      - performancesnap-network

  mongo:
    image: mongo:7
    container_name: performancesnap-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=performancesnap
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - performancesnap-network

  redis:
    image: redis:7-alpine
    container_name: performancesnap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - performancesnap-network

  nginx:
    image: nginx:alpine
    container_name: performancesnap-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - performancesnap-backend
    networks:
      - performancesnap-network

volumes:
  mongo-data:
  mongo-config:
  redis-data:

networks:
  performancesnap-network:
    driver: bridge