<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trace - Admin Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #f9fafb;
        }
        
        #admin-root {
            width: 100%;
            min-height: 100vh;
        }
        
        /* Loading spinner styles */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .loading-subtext {
            font-size: 14px;
            opacity: 0.8;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="admin-root">
        <!-- Loading state while React loads -->
        <div class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text">Loading Admin Dashboard...</div>
            <div class="loading-subtext">
                Initializing Smart Trace administration interface
            </div>
        </div>
    </div>
    
    <!-- React Admin Application -->
    <script type="module" src="/src/admin.tsx"></script>
</body>
</html>
